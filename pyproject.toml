[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-from-git"
version = "0.1.0"
description = "Local-first CLI that turns git history into a Keep a Changelog markdown file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfredo Cardona" }]
keywords = ["changelog", "git", "ollama", "cli", "keep-a-changelog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
git-changelog = "git_changelog.cli:app"

[project.urls]
Homepage = "https://github.com/SilverBomb-Gaming/changelog-from-git"
Repository = "https://github.com/SilverBomb-Gaming/changelog-from-git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
